[package]
name = "bevy_granite"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.15", features = ["dynamic_linking", "bevy_remote", "serialize"] }
serde = { version = "1", features = ["derive"] }
bevy_replicon = "0.29.1"
bevy_replicon_renet2 = { version = "0.1.0" , features = ["native_transport"] }
leafwing-input-manager = "0.16.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3